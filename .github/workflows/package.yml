name: Package mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Package HJSON mod
        run: python tools/package.py
      - name: Upload installable archive
        uses: actions/upload-artifact@v4
        with:
          name: cryosphere
          path: dist/cryosphere.zip
          if-no-files-found: error
